<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Galería Fotográfica de Algeciras</title>
  <style>
    body { 
      font-family: system-ui, sans-serif; margin: 1rem auto; max-width: 800px; padding: 1rem; background-color: #f8f9fa; color: #333333; 
    }
    h1 { 
      text-align: center; color: #111111; margin-bottom: 1.5rem; font-size: 1.6rem; 
    }
    .grid { 
      display: block; 
    }
    figure { 
      margin: 0 0 1.5rem 0; background-color: #ffffff; border: 1px solid #cccccc; border-radius: 6px; padding: 0.5rem; 
    }
    figcaption { 
      text-align: center; margin-top: 0.5rem; font-size: 0.95rem; color: #555555; font-weight: bold; 
    }
    img { 
      width: 100%; height: auto; display: block; border-radius: 4px; 
    }
  </style>
</head>
<body>
  <h1>Patrimonio y Lugares Emblemáticos de Algeciras</h1>
  <section class="grid">
    <figure>
      <img src="..\imagenes\plazaAltaAlgeciras.jpg" alt="Plaza Alta de Algeciras" />
      <figcaption>Plaza Alta y Parroquia de la Palma</figcaption>
    </figure>
    <figure>
      <img src="..\imagenes\murallasMeriniesAlgeciras.jpg" alt="Murallas Meriníes" />
      <figcaption>Restos de las Murallas Meriníes (S. XIV)</figcaption>
    </figure>
    <figure>
      <img src="..\imagenes\parqueMariaCristinaAlgeciras.jpg" alt="Parque María Cristina" />
      <figcaption>Parque María Cristina</figcaption>
    </figure>
    <figure>
      <img src="..\imagenes\puertoAlgeciras.jpg" alt="Puerto de Algeciras" />
      <figcaption>Bahía y Puerto de Algeciras</figcaption>
    </figure>
  </section>
</body>
</html>
