<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>404 – Documento no encontrado</title>
  <style>
    @keyframes flotar {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10px); opacity: 0; }
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui;
      background: #f8f9fa;
      margin: 0;
    }
    h1 { font-size: 5rem; margin: 0; color: #005A9C; animation: flotar 1.8s ease-out forwards; }
    p { font-size: 1.2rem; color: #555; }
    a {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      text-decoration: none;
      border: 1px solid #005A9C;
      padding: .6rem 1.2rem;
      border-radius: 4px;
      color: #005A9C;
      transition: background .3s, color .3s;
    }
    a:hover, a:focus { background: #005A9C; color: #fff; }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>El capítulo de la historia que buscas se ha perdido en el tiempo.</p>
  <a href="Actividad1.html">Volver al Portal Principal</a>
</body>
</html>
