<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reserva de Visita Guiada por Algeciras</title>
  <style>
    body { 
      font-family: system-ui, sans-serif; margin: 1.5rem auto; max-width: 500px; padding: 0 1rem; background-color: #ffffff; color: #333333; 
    }
    h1 { 
      color: #16a085; text-align: center; font-size: 1.6rem; 
    }
    fieldset { 
      border: 1px solid #cccccc; padding: 1.5rem; border-radius: 4px; background-color: #ffffff; 
    }
    legend { 
      color: #16a085; font-weight: bold; font-size: 1rem; padding: 0 0.5rem; 
    }
    label { 
      display: block; margin-top: 1rem; font-weight: bold; 
    }
    input[type=text], input[type=email], input[type=date] { 
      display: block; width: 100%; padding: 0.5rem; margin-top: 0.3rem; border: 1px solid #cccccc; border-radius: 4px; box-sizing: border-box; 
    }
    p { 
      margin-top: 1.2rem; margin-bottom: 0.3rem; font-weight: bold; 
    }
    input[type=range] { 
      width: 100%; margin-top: 0.3rem; 
    }
    small { 
      display: block; color: #666666; margin-top: 0.2rem; 
    }
    button { 
      width: 100%; background-color: #e67e22; color: #ffffff; border: none; font-size: 1rem; font-weight: bold; margin-top: 1.5rem; padding: 0.7rem; border-radius: 4px; cursor: pointer; 
    }
  </style>
</head>
<body>
  <h1>Reserva tu ruta guiada histórica</h1>

  <form action="#" aria-describedby="ayuda-ruta">
    <fieldset>
      <legend>Datos de la Reserva</legend>

      <label>Nombre completo
        <input type="text" name="nombre" required />
      </label>

      <label>Correo Electrónico
        <input type="email" name="email" required />
      </label>

      <label>Fecha de la visita
        <input type="date" name="fecha" required />
      </label>

      <p>Turno de la visita</p>
      <label><input type="radio" name="turno" value="manana" required /> Mañana (Murallas y Plaza Alta)</label>
      <label><input type="radio" name="turno" value="tarde" required /> Tarde (Faro de Carnero y Puerto)</label>

      <label>Nivel de detalle histórico (1 básico – 10 avanzado)
        <input type="range" name="nivel" min="1" max="10" value="5" aria-describedby="ayuda-ruta" />
      </label>
      <small id="ayuda-ruta">Selecciona la profundidad deseada para las explicaciones.</small>

      <label>
        <input type="checkbox" name="guia" /> Incluir audioguía
      </label>
    </fieldset>

    <button type="submit" style="margin-top:1rem; padding:.5rem 1rem;">Confirmar Reserva</button>
  </form>
</body>
</html>
